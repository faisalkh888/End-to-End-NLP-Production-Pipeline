apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: atlas-api}
  template:
    metadata:
      labels: {app: atlas-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: atlas-support-ai:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: VECTOR_BACKEND, value: qdrant}
            - {name: QDRANT_URL, value: http://qdrant:6333}
            - {name: TRIAGE_GENERATOR_URL, value: http://atlas-vllm:8000}
            - {name: TRIAGE_GENERATOR_MODEL, value: atlas-triage-sft}
            - {name: MODEL_VERSION, value: atlas-triage-sft}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: {name: atlas-api-secrets, key: api-token}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          livenessProbe: {httpGet: {path: /health, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: atlas-api}
spec:
  selector: {app: atlas-api}
  ports: [{port: 8000, targetPort: 8000}]
