[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-support-ai"
version = "0.1.0"
description = "RAG and ticket triage production pipeline reference project"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27", "pydantic>=2.6", "httpx>=0.27", "prometheus-client>=0.20", "PyYAML>=6", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.3"]
train = ["torch>=2.2", "transformers>=4.42", "datasets>=2.19", "peft>=0.11", "trl>=0.9", "bitsandbytes>=0.43", "mlflow>=2.13", "dvc>=3.50", "sentence-transformers>=3", "qdrant-client>=1.9"]

[tool.setuptools.packages.find]
include = ["serving*", "ingest*", "training*", "evals*", "observability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
