services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      VECTOR_BACKEND: ${VECTOR_BACKEND:-memory}
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GENERATOR_URL: ${GENERATOR_URL:-}
      TRIAGE_GENERATOR_URL: ${TRIAGE_GENERATOR_URL:-}
      TRIAGE_GENERATOR_MODEL: ${TRIAGE_GENERATOR_MODEL:-atlas-triage-sft}
    depends_on: [qdrant]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  qdrant:
    image: qdrant/qdrant:v1.9.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports: ["5000:5000"]
    volumes: [mlflow_data:/mlartifacts]
  prometheus:
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/atlas.json:ro
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
  vllm:
    image: vllm/vllm-openai:v0.5.3
    profiles: [gpu]
    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct
      - --revision
      - ${BASE_MODEL_REVISION:-aa8e72537993ba99e69dfaafa59ed015b17504d1}
      - --host
      - 0.0.0.0
      - --enable-lora
      - --max-lora-rank
      - "16"
      - --lora-modules
      - atlas-triage-sft=/models/triage-sft
      - --max-model-len
      - "2048"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.85"
      - --cpu-offload-gb
      - "2"
      - --swap-space
      - "1"
      - --enforce-eager
    ports: ["8001:8000"]
    volumes:
      - ./models/triage-sft:/models/triage-sft:ro
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  qdrant_data:
  mlflow_data:
